<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08152a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Blade Radio"><meta name="description" content="Listen live to the Bladerunner Radio Network"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Bladerunner Radio Network</title><style>:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#173e6a,#071426 65%);color:#fff;display:grid;place-items:center;padding:22px}.app{width:min(100%,480px);text-align:center}.brand{letter-spacing:.2em;font-size:12px;color:#8ccaff;font-weight:700}h1{font-size:clamp(28px,8vw,42px);line-height:1.06;margin:12px 0 8px}p{color:#b7cbe2}.panel{background:#10243c;border:1px solid #2c4d6f;border-radius:22px;padding:24px;margin-top:25px;box-shadow:0 18px 45px #0006}.onair{color:#6dd6ff;font-size:13px;letter-spacing:.15em}.station{font-size:26px;font-weight:800;margin:16px 0 24px;min-height:62px;display:grid;place-items:center}button{font:inherit;cursor:pointer}#toggle{background:#55bfff;border:0;border-radius:999px;color:#05192d;font-weight:800;font-size:19px;padding:17px 45px;min-width:170px}#toggle:focus-visible,.choice:focus-visible{outline:3px solid #fff;outline-offset:3px}.status{min-height:24px;font-size:14px;color:#d2e4f7;margin-top:16px}.choices{display:grid;gap:10px;margin-top:20px}.choice{background:#183452;border:1px solid #42678a;color:white;border-radius:12px;padding:15px;font-weight:700;text-align:left}.choice[aria-pressed=true]{border-color:#5fd3ff;background:#235077}.footer{font-size:12px;margin-top:24px;color:#a7bdd4}a{color:#8dd9ff}small{display:block;margin-top:10px;color:#b4cce4}</style></head><body><main class="app"><div class="brand">BLADERUNNER RADIO NETWORK</div><h1>REAL RADIO!</h1><p>Three stations. One place to listen.</p><section class="panel" aria-label="Radio player"><div class="onair">● LIVE STREAM</div><div class="station" id="current">Bladerunner Radio</div><button id="toggle" type="button">▶ Play</button><div class="status" id="status" role="status">Ready to listen</div><div class="choices" aria-label="Choose a station"><button class="choice" type="button" aria-pressed="true" data-id="0">Bladerunner Radio</button><button class="choice" type="button" aria-pressed="false" data-id="1">Bladerunner And The Outlaw Show</button><button class="choice" type="button" aria-pressed="false" data-id="2">RAIdio A.I.R.</button></div><small>Requires an internet connection. Background playback depends on your device.</small></section><div class="footer"><a href="https://www.bladerunnerradio.com/">BladerunnerRadio.com</a></div></main><audio id="audio" preload="none"></audio><script src="app.js"></script></body></html>
